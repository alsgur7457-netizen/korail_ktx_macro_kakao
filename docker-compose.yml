services:
  macro:
    build: .
    image: korail-kakao-macro
    container_name: korail_macro
    env_file:
      - .env
    volumes:
      # Kakao token + Korail device identity survive container rebuilds
      - ./data:/app/data
    # A finished run (reserved, blocked, wrong password...) must not restart by itself:
    # restarting could book a second ticket or hammer the login endpoint.
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
